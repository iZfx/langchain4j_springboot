<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成App截图</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .image-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .image-box {
            width: 200px;
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .image-box h3 {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            text-align: center;
            margin: 0;
        }
        .color-band {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(90deg, #0071e3, #ffac41);
        }
        .content-area {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .heat-map {
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 5px;
            padding: 10px;
        }
        .dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #ff4757;
        }
        .dot.light {
            background: #ffa502;
        }
        .dot.medium {
            background: #3742fa;
        }
        .dot.dark {
            background: #2ed573;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>生成"行迹 - 运动热力图"App模拟截图</h1>
        <p>点击下方按钮生成模拟的App界面截图</p>
        
        <div class="controls">
            <button onclick="generateImages()">生成截图</button>
            <button onclick="downloadImages()">下载截图</button>
        </div>
        
        <div class="image-container" id="imageContainer">
            <!-- 图像将在这里生成 -->
        </div>
    </div>

    <script>
        // 生成随机热力图点
        function generateHeatMap() {
            let dots = '';
            for (let i = 0; i < 80; i++) {
                const intensity = Math.random();
                let className = '';
                if (intensity > 0.8) className = 'dark';
                else if (intensity > 0.6) className = '';
                else if (intensity > 0.4) className = 'light';
                else className = 'medium';
                
                dots += `<div class="dot ${className}"></div>`;
            }
            return dots;
        }

        // 生成单个图像容器
        function createImageDiv(title) {
            return `
                <div class="image-box">
                    <div class="color-band"></div>
                    <div class="content-area">
                        <div class="heat-map">
                            ${generateHeatMap()}
                        </div>
                    </div>
                    <h3>${title}</h3>
                </div>
            `;
        }

        // 生成图像
        function generateImages() {
            const container = document.getElementById('imageContainer');
            
            container.innerHTML = `
                ${createImageDiv('热力图总览')}
                ${createImageDiv('轨迹记录')}
                ${createImageDiv('数据分析')}
                ${createImageDiv('足迹地图')}
            `;
        }

        // 初始化页面
        window.onload = function() {
            generateImages();
        };
    </script>
</body>
</html>
