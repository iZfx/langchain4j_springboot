spring.application.name=langchain4j_springboot
langchain4j.community.dashscope.chat-model.api-key=${ALIAI_API_KEY}
langchain4j.community.dashscope.chat-model.model-name=qwen-plus

langchain4j.community.dashscope.streaming-chat-model.api-key=${ALIAI_API_KEY}
langchain4j.community.dashscope.streaming-chat-model.model-name=qwen-plus

langchain4j.community.dashscope.embedding-model.api-key=${ALIAI_API_KEY}
#langchain4j.community.dashscope.embedding-model.model-name=qwen-max

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.timeout=60s
spring.ai.openai.chat.options.connect-timeout=60s
spring.ai.openai.chat.options.read-timeout=60s

spring.ai.ollama.server-url=http://localhost:11434
spring.ai.ollama.chat.options.model=deepseek-r1:1.5b

