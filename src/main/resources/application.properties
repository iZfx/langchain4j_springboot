# LangChain4j Ollama 配置
langchain4j.ollama.base-url=http://localhost:11434
# 阿里服务器上安装的模型
# langchain4j.ollama.chat-model.model-name=qwen2:0.5b
# langchain4j.ollama.embedding-model.model-name=nomic-embed-text
# Mac 本地安装的模型
langchain4j.ollama.chat-model.model-name=deepseek-r1:1.5b
langchain4j.ollama.embedding-model.model-name=qwen3-embedding:0.6b

# 禁用 Spring AI OpenAI 自动配置
# spring.ai.openai.chat.enabled=false
# spring.ai.openai.embedding.enabled=false

# spring.ai.qianfan.api-key=
